name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-experimental-features = pipe-operators flakes nix-command
      - run: nix flake check --no-build
      - run: |
          nix build \
            .#checks.x86_64-linux.formatting \
            .#packages.x86_64-linux.musicplayer \
            .#packages.x86_64-linux.tairiki \
            .#nixosConfigurations.daedalus.pkgs.solaar
