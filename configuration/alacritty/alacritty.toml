[colors.primary]
background = "#16161d"
foreground = "#ccccd6"
dim_foreground = "#9ca0a4"
bright_foreground = "#f8f8fb"

[colors.cursor]
text = "#16161d"
cursor = "#f8f8fb"

[colors.vi_mode_cursor]
text = "#16161d"
cursor = "#86d9db"

[colors.selection]
text = "#16161d"
background = "#86aeda"

[colors.search.matches]
foreground = "#16161d"
background = "#dada86"

[colors.search.focused_match]
foreground = "#16161d"
background = "#aaccff"

[colors.hints.start]
foreground = "#16161d"
background = "#dada86"

[colors.hints.end]
foreground = "#16161d"
background = "#86d9db"

[colors.line_indicator]
foreground = "#9ca0a4"
background = "#212128"

[colors.footer_bar]
foreground = "#ccccd6"
background = "#212128"

[colors.normal]
black = "#212128"
red = "#ff8888"
green = "#86da87"
yellow = "#dada86"
blue = "#86aeda"
magenta = "#b286db"
cyan = "#64a2a4"
white = "#ccccd6"

[colors.bright]
black = "#5b6268"
red = "#ff8888"
green = "#a1f6a1"
yellow = "#dada86"
blue = "#aaccff"
magenta = "#db85d9"
cyan = "#86d9db"
white = "#f8f8fb"

[window]
dynamic_padding = false
decorations = "none"
opacity = 1.0

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 5
y = 5

[scrolling]
history = 10000
multiplier = 3

[font]
size = 12
builtin_box_drawing = false

[font.normal]
family = "Berkeley Mono"
style = "Book SemiCondensed"

[font.bold]
family = "Berkeley Mono"
style = "Bold SemiCondensed"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

[bell]
animation = "EaseOutExpo"
duration = 0
color = "#ff8888"

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

[selection]
semantic_escape_chars = ",?`|:\"' ()[]{}<>"
save_to_clipboard = true

[cursor]
unfocused_hollow = true

[cursor.style]
shape = "Block"
