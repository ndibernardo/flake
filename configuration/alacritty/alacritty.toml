[terminal.shell]
program = "tmux"
args = ["new-session"]

[window]
dimensions = { columns = 120, lines = 48 }
padding = { x = 12, y = 12 }

[font]
normal = { family = "PragmataPro Mono", style = "Regular" }
bold = { family = "PragmataPro Mono", style = "Bold" }
italic = { family = "PragmataPro Mono", style = "Italic" }
bold_italic = { family = "PragmataPro Mono", style = "Bold Italic" }
size = 13.0

[colors.primary]
background = "#000000"
foreground = "#ffffff"
dim_foreground = "#989898"

[colors.cursor]
text = "#000000"
cursor = "#ff5f59"

[colors.selection]
text = "#ffffff"
background = "#555a66"

[colors.search.matches]
foreground = "#ffffff"
background = "#2266ae"

[colors.search.focused_match]
foreground = "#ffffff"
background = "#7a6100"

[colors.normal]
black = "#1d2235"
red = "#ff5f59"
green = "#44bc44"
yellow = "#d0bc00"
blue = "#2fafff"
magenta = "#feacd0"
cyan = "#00d3d0"
white = "#989898"

[colors.bright]
black = "#61647a"
red = "#ff6b55"
green = "#75c13e"
yellow = "#fec43f"
blue = "#79a8ff"
magenta = "#f78fe7"
cyan = "#4ae2f0"
white = "#ffffff"
