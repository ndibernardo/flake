[general]
import = [ "themes/tokyonight.toml" ]

[font]
size = 11
builtin_box_drawing = true

[font.normal]
family = "Berkeley Mono"
style = "Book SemiCondensed"

[font.bold]
family = "Berkeley Mono"
style = "Bold SemiCondensed"

[font.offset]
x = 0
y = 4

[font.glyph_offset]
x = 0
y = 2

[window]
dynamic_padding = false
decorations = "none"
opacity = 1.0

[window.dimensions]
columns = 150
lines = 65

[window.padding]
x = 10
y = 10

[scrolling]
history = 10000
multiplier = 3

[bell]
animation = "EaseOutExpo"
duration = 0
color = "#ff8888"

[selection]
semantic_escape_chars = ",?`|:\"' ()[]{}<>"
save_to_clipboard = true

[cursor]
unfocused_hollow = true

[cursor.style]
shape = "Block"
blinking = "Never"

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"
