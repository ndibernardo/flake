# tmux configuration. Linked live from the flake checkout; prefix + r reloads.

set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind C-Space send-prefix

setw -g mode-keys vi

set -g base-index 1
set-window-option -g pane-base-index 1

set -sg escape-time 0
set -g history-limit 10000
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g clock-mode-style 24
set-option -g set-clipboard on

### Plugins
# Installed by NixOS into the system profile, so these paths are stable across
# rebuilds without any Nix interpolation in this file.
run-shell /run/current-system/sw/share/tmux-plugins/yank/yank.tmux

# main.tmux reads the launch key from the server environment, not from a
# tmux option, so it has to be set before the plugin is sourced.
set-environment -g TMUX_FZF_LAUNCH_KEY "C-f"
run-shell /run/current-system/sw/share/tmux-plugins/tmux-fzf/main.tmux

### Status line

set -g window-status-format " #I: #W "
set -g window-status-current-format " #I: #W "

set -g status-style "bg=#16161d,fg=#ccccd6"
set -g window-status-style "bg=#16161d,fg=#626276"
set -g window-status-current-style "bg=#1e1e28,fg=#aaccff,bold"
set -g pane-border-style "fg=#373746"
set -g pane-active-border-style "fg=#aaccff"
set -g message-style "bg=#1e1e28,fg=#ff8888,bold"
set -g message-command-style "bg=#1e1e28,fg=#aaccff"
set -g mode-style "bg=#292936,fg=#e9e9f0"
set -g status-right '#[bg=#16161d,fg=#ff8888] %Y-%m-%d  %H:%M '
set-option -g status-position bottom

set -g status-interval 2
set -g status-right-length 59
set -g status-left ""

setw -g window-status-separator '  '

### Bindings

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Horizontal and vertical splits with current path
bind \\ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# New window with current path
bind c new-window -c "#{pane_current_path}"

# Break pane
bind b break-pane -d

# Resize panes using arrow keys
bind Right resize-pane -R 5
bind Left resize-pane -L 5
bind Up resize-pane -U 2
bind Down resize-pane -D 2

# Smart pane switching with awareness of vim splits
bind -n C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-l) || tmux select-pane -R"
bind -n C-\\ run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys 'C-\\') || tmux select-pane -l"

# Copy mode bindings
bind Escape copy-mode
bind C-[ copy-mode
bind p paste-buffer

# Vi-style selection and yanking in copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Break pane into new session
bind-key C-b send-keys 'tat && exit' 'C-m'

# Open man page in split
bind-key C-m command-prompt -p "command:" "split-window -h 'man %%'"

# Run command in new split
bind-key C-c command-prompt -p "command:" "split-window -c '#{pane_current_path}' '%%'"

# Kill session
bind-key K run-shell 'tmux switch-client -n \; kill-session -t "$(tmux display-message -p "#S")" || tmux kill-session'
